name: CI

on: push


jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '14.x'
          cache: 'yarn'
      - name: install
        run: yarn install

      - name: test
        run: yarn lint

      - name: build
        run: yarn build
